<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Blizz Media E-Tickets</title>
  <link rel="stylesheet" href="index.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <!-- Navigation Bar -->
        <nav>
            <div class="logo">
                <img src="Log_Header.png" width="50px" height="auto" alt="Blizz Media Logo"> Blizz Media™
            </div>
            <!-- Hamburger Menu -->
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <i class="fas fa-bars"></i>
            </label>
            <!-- Navigation Links -->
            <ul class="menu">
                <li><a href='https://blizzticky-buy.web.app'>Buy Your Ticket</a></li>
                <li><a href="https://blizzticky-getyours.netlify.app">Get Your Ticket</a></li>
            </ul>
        </nav>
    </header>

  <div class="control-panel">
    <!-- IMAGE PLACEHOLDER -->
    <div class="image-placeholder" >
  
    </div>

    <div class="heading">
      <h1>Blizz Media<br/>E-Ticket Service</h1>
    </div>

    <form id="paymentForm" >
      <div class="form-group">
        <label for="email-address">Email Address*</label>
        <input
          type="email"
          name="email"
          id="email-address"
          required
        />
      </div>

      <div class="form-group">
        <label for="amount">Amount*</label>
        <input
          type="tel"
          id="amount"
          readonly
          required
        />
      </div>

      <label for="ticket-type">Ticket Type*
        <div class="checkbox_group">
          <select name="package" id="guesttype">
            <option value="single" id="Single">Single</option>
            <option value="couple" id="Couple">Couple</option>
          </select>
          <label>
            <input
              type="radio"
              name="package"
              id="vip"
              required
            />
            VIP
          </label>
          <label>
            <input
              type="radio"
              name="package"
              id="reg"
              required
            />
            Regular
          </label>
        </div>
      </label>

      <div id="form-group">
      
      </div>

      <div class="form-group">
        <label for="numberBox">Phone Number*</label>
        <input
          id="numberBox"
          type="tel"
          pattern="^(\+233|233|0)?\d{9}$"
          required
        />
      </div>

      <div class="form-submit">
        <button class="btn-pay" >Pay</button>
      </div>
    </form>
  </div>

  <!-- SUCCESS MODAL -->
<div id="success-modal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <h2>Payment Successful!</h2>
    <p id="custom-text">Thank you for your purchase.</p>
   
    <div class="ref-box">
      <input type="text" id="transaction-ref" readonly />
      <button id="copy-ref" class="copy-button">Copy</button>
    </div>
   
    <p>
      <a class="link" href="#" target="_blank">Go to ticket generator</a>
    </p>
  </div>
</div> 
  <script type="module"  src="paystack.js"></script>
</body>
</html>
